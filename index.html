.dim{background:#050320;opacity:.78}
.flash{mix-blend-mode:screen;pointer-events:none}
#fx{pointer-events:none}
.rk{position:absolute;left:0;top:0;height:clamp(190px,44svh,520px);width:auto;opacity:0;transition:opacity .5s;will-change:transform;pointer-events:none}
#pot{position:absolute;left:50%;bottom:4svh;height:clamp(150px,29svh,330px);aspect-ratio:396/629;transform:translate(-50%,40px) scale(.9);opacity:0;transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}
#pot.on{opacity:1;transform:translate(-50%,0) scale(1)}
#pot img{position:absolute;inset:0;width:100%;height:100%}
#pot .pb{transform-origin:43% 36%;opacity:0}
#title{position:absolute;left:0;right:0;top:15svh;text-align:center;padding:0 5vw;pointer-events:none}
#title.on{pointer-events:auto}
.hi{font-family:var(--script);font-size:clamp(1.8rem,5vw,3.2rem);margin:0 0 -.35em;color:#fff;opacity:0;transform:translateY(10px);transition:opacity .9s .2s,transform .9s .2s}
h1{font-family:var(--script);font-weight:400;font-size:clamp(4.6rem,min(24vw,28svh),13rem);line-height:1.05;margin:0;padding:.18em .1em 0;display:inline-block;
background:linear-gradient(180deg,#fff9e6 8%,#ffd77a 52%,#f0a43a 92%);-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 0 .12em rgba(255,170,60,.55));clip-path:inset(0 100% 0 0);transition:clip-path 1.8s cubic-bezier(.5,0,.2,1) .1s}
.f{position:relative}
.f::before{content:"";position:absolute;left:44%;top:.1em;width:.09em;height:.2em;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;
background:linear-gradient(#fff7c2,#ffb31a 55%,#ff7a00);box-shadow:0 0 .22em .05em rgba(255,170,40,.85);opacity:0;transition:opacity .6s 1.6s;
-webkit-text-fill-color:initial;animation:flick 1.3s ease-in-out infinite alternate}
@keyframes flick{from{transform:scaleY(.9) skewX(-3deg)}to{transform:scaleY(1.08) skewX(3deg)}}
.sub{margin:.2rem 0 1.4rem;font-size:clamp(1rem,2.2vw,1.35rem);color:var(--ink);opacity:0;transition:opacity 1s 1.4s}
.cta{display:inline-block;padding:.8rem 1.7rem;border-radius:999px;background:var(--gold);color:#2a1100;font-weight:600;font-size:1.05rem;text-decoration:none;opacity:0;transition:opacity 1s 1.8s,transform .2s,box-shadow .2s}
.cta:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(255,200,87,.45)}
.cta:focus-visible,#replay:focus-visible,.buy:focus-visible{outline:3px solid #fff;outline-offset:3px}
#title.on h1{clip-path:inset(0 0 0 0)}#title.on .hi,#title.on .sub,#title.on .cta{opacity:1;transform:none}#title.on .f::before{opacity:1}
#replay{position:absolute;right:max(14px,3vw);top:max(14px,env(safe-area-inset-top,0px));z-index:9;background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.45rem 1rem;font:inherit;font-size:.95rem;cursor:pointer;backdrop-filter:blur(6px)}
#replay:hover{background:rgba(255,255,255,.16)}
#title{z-index:6}#replay{z-index:9}
#shop{position:relative;background:linear-gradient(var(--night),var(--deep) 30%,#0e0932);padding:12vh 5vw 8vh}
.wrap{max-width:1180px;margin:0 auto}
h2{font-family:var(--disp);font-weight:400;font-size:clamp(2rem,4.6vw,3.2rem);margin:0 0 .6rem;color:#fff1cf}
.lead{max-width:46ch;color:var(--mute);font-size:1.1rem;line-height:1.6;margin:0 0 3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.3rem}
.card{--c:255,200,87;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,rgba(var(--c),.22),rgba(255,255,255,.02) 70%);display:flex;flex-direction:column}
.pic{height:300px;display:grid;place-items:center;padding-top:1rem}
.pic img{height:270px;width:auto;max-width:90%;object-fit:contain;transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .35s;filter:drop-shadow(0 10px 20px rgba(var(--c),.25))}
.card:hover .pic img{transform:translateY(-10px) scale(1.04);filter:drop-shadow(0 16px 34px rgba(var(--c),.55))}
.info{padding:1.1rem 1.3rem 1.4rem;display:flex;flex-direction:column;gap:.45rem;flex:1}
.info h3{font-family:var(--disp);font-weight:400;font-size:1.25rem;margin:0}
.info p{margin:0;color:var(--mute);font-size:.98rem;line-height:1.5;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:.7rem;gap:.6rem}
.price{font-weight:600;font-size:1.1rem}.price small{color:var(--mute);font-weight:400;font-size:.85rem}
.buy{border:1px solid var(--gold);background:transparent;color:var(--gold);border-radius:999px;padding:.4rem 1rem;font:inherit;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
.buy:hover,.buy[aria-pressed=true]{background:var(--gold);color:#2a1100}
footer{padding:3rem 5vw 4rem;text-align:center;background:#0e0932;color:var(--mute);font-size:.95rem}
footer b{display:block;font-family:var(--script);font-weight:400;font-size:2.4rem;color:var(--gold);margin-bottom:.3rem}
#replay{min-height:44px}
@media(max-width:600px){#title{top:12svh}.sub{padding:0 4vw;line-height:1.4}.team{margin-top:.2rem}}
@media(max-height:480px){#title{top:5svh}.hi{font-size:1.5rem}h1{font-size:clamp(3rem,26svh,6rem)}.sub{margin:0 0 .3rem;font-size:.95rem}#pot{height:34svh;bottom:2svh}.rk{height:50svh}}
.bg{translate:calc(var(--px,0)*-8px) calc(var(--py,0)*-8px);scale:1.07}
#fx,.flash,.rk,#pot{translate:calc(var(--px,0)*-16px) calc(var(--py,0)*-16px)}
#title{translate:calc(var(--px,0)*-28px) calc(var(--py,0)*-28px)}
#tilt{position:absolute;left:max(14px,3vw);top:max(14px,env(safe-area-inset-top,0px));z-index:9;min-height:44px;background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:.45rem 1rem;font:inherit;font-size:.95rem;cursor:pointer;backdrop-filter:blur(6px)}
#tilt:focus-visible{outline:3px solid #fff;outline-offset:3px}
#pot.ready{cursor:pointer}#pot:focus-visible{outline:3px solid #fff;outline-offset:6px;border-radius:12px}#hint{position:absolute;left:50%;top:-2.4rem;transform:translateX(-50%);white-space:nowrap;color:var(--gold);font-size:1.05rem;font-weight:600;opacity:0;pointer-events:none;text-shadow:0 0 12px rgba(0,0,0,.8)}#pot.ready #hint{animation:pulse 1.6s ease-in-out infinite}#pot.ready img:first-child{animation:glow 1.6s ease-in-out infinite alternate}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@keyframes glow{from{filter:drop-shadow(0 0 4px rgba(255,200,87,.2))}to{filter:drop-shadow(0 0 22px rgba(255,200,87,.85))}}
@media(prefers-reduced-motion:reduce){#tilt{display:none}.bg,#fx,.flash,.rk,#pot,#title{translate:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}}
.team{margin:0;font-family:var(--disp);font-size:clamp(1.1rem,2.6vw,1.6rem);color:var(--gold);letter-spacing:.04em;opacity:0;transition:opacity 1s 1.8s}#title.on .team{opacity:1}
</style>
</head>
<body>
<section id="stage" aria-label="Diwali fireworks">
  <div class="bg" role="img" aria-label="Night sky with colourful fireworks"></div>
  <div class="dim"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <img class="rk" id="rk0" data-k="r1" alt="" aria-hidden="true">
  <img class="rk" id="rk1" data-k="r2" alt="" aria-hidden="true">
  <img class="rk" id="rk2" data-k="r3" alt="" aria-hidden="true">
  <div id="pot" role="button" tabindex="-1" aria-label="Tap the flower pot to light it"><img data-k="pot" alt=""><img class="pb" data-k="burst" alt="" aria-hidden="true"><span id="hint">Tap the flower pot</span></div>
  <header id="title">
    <p class="hi">Happy</p>
    <h1>D<span class="f">i</span>wa<span class="f">l</span>i</h1>
    <p class="sub">Wishing you light, joy and a bright year ahead.</p>
    <p class="team">Mayura</p>
  </header>
  <button id="replay" type="button">Replay</button>
  <button id="tilt" type="button" hidden>Enable tilt</button>
